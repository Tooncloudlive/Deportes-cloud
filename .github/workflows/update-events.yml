name: Actualizar Eventos Deportivos

on:
  # Ejecutar automáticamente todos los días a las 6:00 AM (UTC-3)
  schedule:
    - cron: '0 9 * * *'  # 9:00 UTC = 6:00 AM Argentina/UTC-3
  
  # Permitir ejecución manual desde la pestaña Actions
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razón de la ejecución manual'
        required: false
        default: 'Actualización manual'

# Permisos necesarios para hacer push
permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del código
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. Configurar Node.js
      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # 3. Instalar dependencias
      - name: 📦 Instalar dependencias
        run: |
          echo "Instalando dependencias..."
          npm install
      
      # 4. Instalar Playwright browsers
      - name: 🎭 Instalar Playwright browsers
        run: |
          echo "Instalando browsers de Playwright..."
          npx playwright install chromium
      
      # 5. Ejecutar el scraper
      - name: 🚀 Ejecutar scraper
        run: |
          echo "Iniciando scraping de eventos..."
          npm run scrape
        env:
          CI: true
      
      # 6. Verificar si hay cambios
      - name: 🔍 Verificar cambios
        id: verify-changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No hay cambios en los eventos"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Se detectaron cambios en los eventos"
          fi
      
      # 7. Commit y push si hay cambios
      - name: 💾 Commit y Push
        if: steps.verify-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "🔄 Auto-update: Eventos deportivos actualizados - $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "✅ Cambios subidos exitosamente"
      
      # 8. Notificación de éxito (opcional - requiere configuración)
      - name: ✅ Notificar éxito
        if: success()
        run: |
          echo "🎉 ¡Automatización completada exitosamente!"
          echo "📅 Fecha: $(date)"
          echo "🔗 Repositorio: ${{ github.repository }}"
